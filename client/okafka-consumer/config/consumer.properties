# Kafka topic created with DBMS_AQADM.CREATE_DATABASE_KAFKA_TOPIC.
topic.name=AIE_EVENTS

# Demo mode: keep the consumer running so the presenter can stop it with Ctrl+C.
# Use --max-messages=10 when an automated run should stop after the demo batch.
max.messages=0
poll.timeout.ms=3000
idle.exit.after.seconds=0
print.headers=true

# OKafka connection to Autonomous Database through the prepared wallet.
# run_consumer.sh derives these values from wallet/tns_admin/tnsnames.ora and
# passes them as OKAFKA_* environment overrides. The placeholders below are
# intentionally generic for direct/manual execution.
security.protocol=SSL
bootstrap.servers=<adb-host>:1522
oracle.service.name=<adb-service-name>
# Relative path from client/okafka-consumer when the client is executed through the demo scripts.
oracle.net.tns_admin=../../wallet/tns_admin
tns.alias=<wallet-tns-alias>

# Non-secret runtime default. The password is read from OKAFKA_PASSWORD.
runtime.db.user=AIE

# Standard Kafka consumer properties supported by OKafka.
group.id=AIE_OKAFKA_CONSUMER_DEMO
client.id=AIE_OKAFKA_CONSUMER_CLIENT
enable.auto.commit=false
max.poll.records=10
auto.offset.reset=earliest
default.api.timeout.ms=180000
# Use Oracle's TxEventQ-aware assignor explicitly. Oracle documents this as the
# OKafka default, but setting it makes the demo configuration unambiguous.
partition.assignment.strategy=org.oracle.okafka.clients.consumer.TxEQAssignor
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
